groups:
  - name: saas-operations
    rules:
      - alert: SaasApiServerErrors
        expr: increase(saas_http_server_errors_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "SaaS API 5xx errors are increasing"

      - alert: SaasApiLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket[10m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "SaaS API p95 latency exceeds one second"

      - alert: SaasBookingApprovalQueueOld
        expr: saas_queue_oldest_age_seconds{queue="booking_approval"} > 600
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Booking approval queue is aging"

      - alert: SaasAccountEmailQueueOld
        expr: saas_queue_oldest_age_seconds{queue="account_email"} > 120
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Account email delivery queue is delayed"

      - alert: SaasPushQueueLarge
        expr: saas_queue_pending{queue="push"} > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Push delivery queue is large"

      - alert: SaasBackupMissing
        expr: time() - saas_backup_last_success_timestamp_seconds > 90000
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "No successful encrypted backup in the last 25 hours"

      - alert: SaasDiskSpaceLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"} < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host filesystem has less than 15% free space"

      - alert: SaasTargetDown
        expr: up{job="saas-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "SaaS backend metrics target is down"
