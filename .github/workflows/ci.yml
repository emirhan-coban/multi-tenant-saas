name: CI

# Faz 9 — her itme ve pull request'te: backend testleri (gerçek PostgreSQL + Redis ile,
# kısıtlı veritabanı rolü altında), ön yüz testleri ve üretim imajlarının derlenmesi.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend testleri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers Docker'ı kendisi yönetir; runner'da hazır gelir.
      - name: Testler
        working-directory: backend
        run: ./mvnw -B test

      - name: Test raporları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  web:
    name: Ön yüz testleri
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıklar
        working-directory: web
        run: npm ci

      - name: Tip denetimi ve derleme
        working-directory: web
        run: npm run build

      - name: Birim testleri
        working-directory: web
        run: npm test

  migrations:
    name: Göç sırası denetimi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Aynı sürüm numarasıyla iki göç dosyası olursa Flyway açılışta patlar;
      # bunu CI'da erken yakalarız.
      - name: Yinelenen sürüm var mı
        run: |
          duplicates=$(ls backend/src/main/resources/db/migration \
            | sed -n 's/^\(V[0-9]*\)__.*/\1/p' | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Yinelenen göç sürümleri: $duplicates" >&2
            exit 1
          fi
          echo "Göç sürümleri benzersiz."

  images:
    name: Üretim imajları
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4

      - name: Backend imajı
        run: docker build -t saas-backend:ci ./backend

      - name: Ön yüz imajı
        run: docker build -t saas-web:ci ./web

      # İmaj gerçekten açılıyor mu: sağlık ucu yanıt verene kadar beklenir.
      - name: Ön yüz imajı açılıyor mu
        run: |
          docker run -d --name web-ci -p 8088:80 saas-web:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8088/index.html >/dev/null; then
              echo "Ön yüz imajı ayakta."
              docker rm -f web-ci
              exit 0
            fi
            sleep 2
          done
          docker logs web-ci
          docker rm -f web-ci
          exit 1
