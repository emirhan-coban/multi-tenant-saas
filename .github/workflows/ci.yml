name: CI

# Faz 9 — her itme ve pull request'te: backend testleri (gerçek PostgreSQL + Redis ile,
# kısıtlı veritabanı rolü altında), ön yüz testleri ve üretim imajlarının derlenmesi.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend testleri
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        timezone: [UTC, Europe/Istanbul]
    env:
      TZ: ${{ matrix.timezone }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Testcontainers Docker'ı kendisi yönetir; runner'da hazır gelir.
      - name: Testler (${{ matrix.timezone }})
        working-directory: backend
        run: ./mvnw -B test

      - name: Test raporları
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  web:
    name: Ön yüz testleri
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bağımlılıklar
        working-directory: web
        run: npm ci

      - name: Tip denetimi ve derleme
        working-directory: web
        run: npm run build

      - name: Birim testleri
        working-directory: web
        run: npm test

  migrations:
    name: Göç sırası denetimi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # Aynı sürüm numarasıyla iki göç dosyası olursa Flyway açılışta patlar;
      # bunu CI'da erken yakalarız.
      - name: Yinelenen sürüm var mı
        run: |
          duplicates=$(ls backend/src/main/resources/db/migration \
            | sed -n 's/^\(V[0-9]*\)__.*/\1/p' | sort | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Yinelenen göç sürümleri: $duplicates" >&2
            exit 1
          fi
          echo "Göç sürümleri benzersiz."

  images:
    name: Üretim imajları
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, web]
    steps:
      - uses: actions/checkout@v4

      - name: Backend imajı
        run: docker build -t saas-backend:ci ./backend

      - name: Migration imajı
        run: docker build --target migration -t saas-migration:ci ./backend

      - name: Ön yüz imajı
        run: docker build -t saas-web:ci ./web

      - name: Smoke ortamı için geçici ayarlar
        run: |
          cat > .env.ci <<'EOF'
          POSTGRES_DB=saasdb
          IMAGE_TAG=ci
          POSTGRES_USER=saas_owner
          POSTGRES_PASSWORD=ci-owner-password
          APP_DB_USER=saas_app
          APP_DB_PASSWORD=ci-app-password
          APP_JWT_SECRET=ci-jwt-secret-123456789012345678901234
          APP_ALLOWED_ORIGINS=https://ci.example.test
          APP_HSTS_MAX_AGE_SECONDS=31536000
          APP_OPS_METRICS_TOKEN=ci-ops-token
          # Yalnız CI smoke ortamına ait sabit test çifti; canlı anahtar değildir.
          APP_PUSH_VAPID_PUBLIC_KEY=BG6ewAYoKaYdxSyENaSRA1219oH7D69eTx18VRuMWSsyTlo5e6bscqzcSCBBT2EIKWxRQtoG5X5bm9_Y0pZkC50
          APP_PUSH_VAPID_PRIVATE_KEY=R1InDPpQ3Fg0ModJ15almusdDarxqgyVp7l65LyeNUQ
          APP_PUSH_SUBJECT=mailto:ci@example.test
          APP_PUBLIC_BASE_URL=https://ci.example.test
          APP_ACCOUNT_MAIL_KEY=QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
          MAIL_ENABLED=false
          MAIL_DELIVERY_MODE=test
          GMAIL_ADDRESS=ci@example.test
          GMAIL_APP_PASSWORD=ci-not-used
          APP_BILLING_CALLBACK_URL=https://ci.example.test/api/public/billing/iyzico/callback
          IYZICO_BASE_URL=https://sandbox-api.iyzipay.com
          IYZICO_API_KEY=ci-api-key
          IYZICO_SECRET_KEY=ci-secret-key
          IYZICO_MERCHANT_ID=ci-merchant
          IYZICO_PLAN_REFERENCE=ci-plan
          APP_SUPPORT_OWNER=ci-operations
          EOF

      # Frontend nginx, backend readiness, PostgreSQL ve Redis aynı compose ağında sınanır.
      - name: Üretim benzeri smoke ortamını aç
        run: |
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml --env-file .env.ci up -d --no-build || {
            docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml --env-file .env.ci logs backend migration
            exit 1
          }
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/index.html >/dev/null \
              && curl -fsS http://127.0.0.1:8080/api/health >/dev/null \
              && docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml --env-file .env.ci \
                exec -T backend wget -qO- http://127.0.0.1:8080/actuator/health/readiness \
                | grep -q '"status":"UP"'; then
              echo "Backend, PostgreSQL, Redis ve nginx smoke kontrolü geçti."
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml --env-file .env.ci logs
          exit 1

      - name: Smoke ortamını kapat
        if: always()
        run: docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml --env-file .env.ci down -v
