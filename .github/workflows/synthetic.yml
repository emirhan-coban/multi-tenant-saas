name: Synthetic

# Canlı demoyu düzenli sınar (salt okunur Playwright). PR'ları bloklamaz; kırmızı olursa
# Actions sekmesinde ve e-posta bildiriminde görünür. Elle de çalıştırılabilir.
on:
  push:
    branches: [chore/ops-d] # GEÇİCİ: birleştirmeden önce kaldırılacak
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  live:
    name: Canlı demo
    runs-on: ubuntu-24.04 # Playwright 1.55 ubuntu-26.04 desteklemiyor
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Bağımlılıklar
        working-directory: e2e
        run: npm ci
      - name: Chromium
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Testler
        working-directory: e2e
        run: npx playwright test
      - name: Rapor
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          if-no-files-found: ignore
