# Bağımlılık güncellemeleri haftalık ve gruplu gelir; her PR normal CI'dan geçer.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      maven-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /web
    schedule: { interval: weekly, day: monday }
