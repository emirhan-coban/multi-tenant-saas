spring:
  application:
    name: saas-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/saasdb
    username: admin
    password: admin123

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info

server:
  port: 8080

app:
  jwt:
    secret: "12342222233232325678987654321213324355232323122321"
    expiration-minutes: 60