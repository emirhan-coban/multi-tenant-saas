<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#177f7c">
  <title>Çevrimdışı · Berber Randevu</title>
  <style>
    :root { color-scheme: light dark; --ink: #151a19; --muted: #5f6966; --bg: #f4f2ee; --card: #fff; --teal: #177f7c; }
    @media (prefers-color-scheme: dark) { :root { --ink: #eef1f0; --muted: #a9b3b0; --bg: #121615; --card: #1c2220; --teal: #4fc3bd; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { width: min(440px, 100%); padding: 32px 28px; border-radius: 16px; background: var(--card); box-shadow: 0 16px 40px rgba(0,0,0,.08); text-align: center; }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { margin: 18px 0 8px; font-size: 1.6rem; line-height: 1.2; }
    p { margin: 0 0 12px; color: var(--muted); }
    button { margin-top: 14px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 8px; background: var(--teal); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>İnternet bağlantısı yok</h1>
    <p>Randevu oluşturma, onay ve iptal işlemleri güncel bilgi gerektirdiği için çevrimdışı yapılamaz.</p>
    <p>Bağlantı geldiğinde kaldığın yerden devam edebilirsin.</p>
    <button type="button" onclick="location.reload()">Tekrar dene</button>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
