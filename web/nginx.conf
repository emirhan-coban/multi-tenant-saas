server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Sunucu sürümü sızdırılmaz.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
    gzip_min_length 1024;

    # Faz 9 güvenlik başlıkları. CSP: uygulama tek kaynaklıdır; 3B sahne WebGL kullanır,
    # harici betik veya çerçeve yoktur. 'unsafe-inline' yalnızca stil için gereklidir
    # (styled bileşenler ve Three.js'in ürettiği satır içi stiller).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Parmak izli varlıklar uzun süre önbelleklenir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Service worker güncellemesi engellenmemeli.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }

    # API aynı kaynaktan sunulur: tarayıcı için CORS gerekmez, çerez/token tek origin'de kalır.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # API yanıtları hiçbir katmanda önbelleklenmez.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # SPA yönlendirmesi.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
