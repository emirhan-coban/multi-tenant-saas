server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Sunucu sürümü sızdırılmaz.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;
    gzip_min_length 1024;

    # Faz 9 güvenlik başlıkları. CSP: uygulama tek kaynaklıdır; 3B sahne WebGL kullanır,
    # Ana uygulamada harici betik yoktur. Ödeme sağlayıcısının HTML'i, ana sayfanın CSP'sini
    # gevşetmeden data: kaynaklı ve ayrı origin'li sandbox iframe içinde çalışır.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # Parmak izli varlıklar uzun süre önbelleklenir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Service worker güncellemesi engellenmemeli.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
    }

    # API aynı kaynaktan sunulur: tarayıcı için CORS gerekmez, çerez/token tek origin'de kalır.
    location /api/ {
        # Upstream adı DEĞİŞKENLE verilir; böylece nginx onu açılışta değil, istek anında
        # çözer. Doğrudan "proxy_pass http://backend:8080" yazıldığında nginx, backend
        # konteyneri henüz yokken "host not found in upstream" ile hiç başlamıyordu:
        # backend gecikse ya da düşse statik uygulama da (PWA çevrimdışı kabuğu dahil)
        # servis edilemezdi. Bu hâliyle site ayakta kalır, yalnızca /api 502 döner ve
        # arayüz kendi "sunucuya ulaşılamadı" durumunu gösterir.
        # 127.0.0.11 Docker'ın gömülü DNS'i; compose ile çalıştığımız için sabit verilir.
        resolver 127.0.0.11 valid=30s ipv6=off;
        resolver_timeout 5s;
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # İstemcinin gönderdiği sahte forwarded zincirini taşımayın; backend yalnız
        # bu ters vekilin yazdığı tekil adresi görmelidir.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # API yanıtları hiçbir katmanda önbelleklenmez.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # SPA yönlendirmesi.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
