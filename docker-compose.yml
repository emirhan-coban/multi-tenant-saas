services:
  postgres:
    image: postgres:16-alpine
    container_name: saas_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Faz 9: uygulamanın kullandığı süper kullanıcı olmayan rol.
      APP_DB_USER: ${APP_DB_USER:-saas_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-saas_app_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: saas_redis
    ports:
      - "6379:6379"

  backend:
    profiles: ["app"]
    image: maven:3.9-eclipse-temurin-21
    container_name: saas_backend
    working_dir: /workspace
    command: ["./mvnw", "spring-boot:run"]
    env_file:
      - path: .env.mail
        required: false
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/${POSTGRES_DB}}
      # Uygulama: RLS'i atlayamayan rol. Flyway: şema sahibi.
      APP_DB_USER: ${APP_DB_USER:-saas_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-saas_app_dev}
      DB_OWNER_USER: ${DB_OWNER_USER:-${POSTGRES_USER}}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:-${POSTGRES_PASSWORD}}
      APP_REDIS_URL: ${APP_REDIS_URL:-redis://redis:6379}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
    ports:
      - "8081:8080"
    volumes:
      - ./backend:/workspace
      - maven_cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    profiles: ["app"]
    image: node:22-alpine
    container_name: saas_frontend
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_URL: http://localhost:8081
    ports:
      - "5173:5173"
    volumes:
      - ./web:/app
      - npm_cache:/root/.npm
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
  maven_cache:
    name: saas_maven_cache
  npm_cache:
    name: saas_npm_cache
