# Faz 9 — üretim benzeri dağıtım. Geliştirme dosyasından farkları:
#   * kaynak kod bağlanmaz, imajlar derlenir;
#   * uygulama süper kullanıcı olmayan saas_app rolüyle bağlanır;
#   * sırlar .env.prod dosyasından gelir, varsayılanları yoktur;
#   * yalnızca ön yüz dışarıya açılır, veritabanı ve Redis ağa çıkmaz.
#
# Çalıştırma:  docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Gerekli değişkenler için ops/env.prod.example dosyasına bakın.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?zorunlu}
      POSTGRES_USER: ${POSTGRES_USER:?zorunlu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?zorunlu}
      APP_DB_USER: ${APP_DB_USER:?zorunlu}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?zorunlu}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ops/db:/docker-entrypoint-initdb.d:ro
    # Dışarıya port açılmaz; yalnızca compose ağından erişilir.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-saas-backend}:${IMAGE_TAG:?zorunlu}
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      APP_REDIS_URL: redis://redis:6379
      SPRING_FLYWAY_ENABLED: "false"
      # Güvenlik: aşağıdakiler eksikse uygulama açılmaz (SecurityStartupCheck).
      APP_SECURITY_DEV_SECRETS_ALLOWED: "false"
      APP_JWT_SECRET: ${APP_JWT_SECRET:?zorunlu}
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:?zorunlu}
      APP_HSTS_MAX_AGE_SECONDS: ${APP_HSTS_MAX_AGE_SECONDS:-31536000}
      # nginx istemci adresini X-Forwarded-For olarak yazar (tek atlama); istemcinin kendi başlığına güvenilmez.
      APP_TRUSTED_PROXY_HOPS: "1"
      APP_OPS_METRICS_TOKEN: ${APP_OPS_METRICS_TOKEN:?zorunlu}
      APP_PUSH_VAPID_PUBLIC_KEY: ${APP_PUSH_VAPID_PUBLIC_KEY:?zorunlu}
      APP_PUSH_VAPID_PRIVATE_KEY: ${APP_PUSH_VAPID_PRIVATE_KEY:?zorunlu}
      APP_PUSH_SUBJECT: ${APP_PUSH_SUBJECT:?zorunlu}
      APP_PUSH_ALLOW_EPHEMERAL_KEYS: "false"
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:?zorunlu}
      APP_ACCOUNT_MAIL_KEY: ${APP_ACCOUNT_MAIL_KEY:?zorunlu}
      MAIL_ENABLED: ${MAIL_ENABLED:?zorunlu}
      MAIL_DELIVERY_MODE: ${MAIL_DELIVERY_MODE:?zorunlu}
      GMAIL_ADDRESS: ${GMAIL_ADDRESS:?zorunlu}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:?zorunlu}
      APP_BILLING_CALLBACK_URL: ${APP_BILLING_CALLBACK_URL:?zorunlu}
      IYZICO_BASE_URL: ${IYZICO_BASE_URL:-https://api.iyzipay.com}
      IYZICO_API_KEY: ${IYZICO_API_KEY:?zorunlu}
      IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:?zorunlu}
      IYZICO_MERCHANT_ID: ${IYZICO_MERCHANT_ID:?zorunlu}
      IYZICO_PLAN_REFERENCE: ${IYZICO_PLAN_REFERENCE:?zorunlu}
      APP_SUPPORT_OWNER: ${APP_SUPPORT_OWNER:?zorunlu}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    # Ters vekil (frontend) üzerinden erişilir; doğrudan port açılmaz.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 3s
      start_period: 60s
      retries: 5

  migration:
    image: ${MIGRATION_IMAGE:-saas-migration}:${IMAGE_TAG:?zorunlu}
    build:
      context: ./backend
      target: migration
    restart: "no"
    # İmajın varsayılan komutu yoktur; komut verilmezse Flyway yalnızca yardım basıp çıkar
    # ve şema hiç oluşmaz (backend sağlıksız kalır).
    command: ["-connectRetries=10", "migrate"]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-saas-web}:${IMAGE_TAG:?zorunlu}
    build:
      context: ./web
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./ops/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    secrets: [ops_metrics_token]
    depends_on: [backend, alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    profiles: [monitoring]
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./ops/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    secrets: [alert_webhook_url]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    restart: unless-stopped
    profiles: [monitoring]
    command: ["--path.rootfs=/host", "--collector.textfile.directory=/textfile"]
    volumes:
      - /:/host:ro,rslave
      - ./ops/monitoring/textfile:/textfile:ro

secrets:
  ops_metrics_token:
    file: ./secrets/ops_metrics_token
  alert_webhook_url:
    file: ./secrets/alert_webhook_url

volumes:
  pgdata:
  prometheus_data:
  alertmanager_data:
